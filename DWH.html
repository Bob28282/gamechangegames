<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dogwifhat (WIF) Price Tracker</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #2a2a2a; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { margin: 0 0 10px 0; color: #ffcc00; }
        .price { font-size: 2.5rem; font-weight: bold; margin: 20px 0; }
        .update { font-size: 0.8rem; color: #888; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎩 dogwifhat (WIF)</h1>
        <div class="price" id="price">Loading...</div>
        <div class="update" id="time">Fetching real-time data...</div>
    </div>
    <script>
        async function fetchPrice() {
            try {
                const res = await fetch('https://coingecko.com');
                const data = await res.json();
                const price = data.dogwifhat.usd;
                document.getElementById('price').innerText = $${price.toFixed(4)} USD;
                document.getElementById('time').innerText = Last updated: ${new Date().toLocaleTimeString()};
            } catch (err) {
                document.getElementById('price').innerText = "Error loading price";
            }
        }
        fetchPrice();
        setInterval(fetchPrice, 30000); // Refreshes every 30 seconds
    </script>
</body>
</html>
