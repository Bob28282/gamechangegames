<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      font-family: Arial, sans-serif;
      color: white;
    }

    .movie-container {
      width: min(100%, 1000px);
      margin: 40px auto;
      padding: 0 16px;
    }

    .video-wrapper {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }

    .controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
      opacity: 0;
      transition: opacity 0.25s;
    }

    .video-wrapper:hover .controls,
    .video-wrapper:focus-within .controls {
      opacity: 1;
    }

    button,
    select {
      background: rgba(255, 255, 255, 0.15);
      border: 0;
      color: white;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover,
    select:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .progress {
      flex: 1;
      cursor: pointer;
    }

    .volume {
      width: 90px;
    }

    .time {
      font-size: 13px;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <main class="movie-container">
    <div class="video-wrapper" id="videoWrapper">

      <video id="movie" preload="metadata">
        <source src="https://res.cloudinary.com/rlcijsr6/video/upload/v1786250033/2020dabei_hkifio.mp4" 
        type="video/mp4">
      </video>

      <div class="controls">

        <button id="playBtn" type="button">▶</button>

        <input
          id="progress"
          class="progress"
          type="range"
          min="0"
          max="100"
          value="0"
          step="0.1"
          aria-label="Video progress"
        />

        <span id="time" class="time">0:00 / 0:00</span>

        <input
          id="volume"
          class="volume"
          type="range"
          min="0"
          max="1"
          value="1"
          step="0.05"
          aria-label="Volume"
        />

        <select id="speed" aria-label="Playback speed">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
        </select>

        <button id="fullscreenBtn" type="button">⛶</button>

      </div>
    </div>
  </main>

  <script>
    const video = document.getElementById("movie");
    const playBtn = document.getElementById("playBtn");
    const progress = document.getElementById("progress");
    const volume = document.getElementById("volume");
    const speed = document.getElementById("speed");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const videoWrapper = document.getElementById("videoWrapper");
    const timeDisplay = document.getElementById("time");

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";

      const minutes = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);

      return `${minutes}:${secs.toString().padStart(2, "0")}`;
    }

    function togglePlay() {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    }

    playBtn.addEventListener("click", togglePlay);

    video.addEventListener("play", () => {
      playBtn.textContent = "❚❚";
    });

    video.addEventListener("pause", () => {
      playBtn.textContent = "▶";
    });

    video.addEventListener("loadedmetadata", () => {
      timeDisplay.textContent =
        `0:00 / ${formatTime(video.duration)}`;
    });

    video.addEventListener("timeupdate", () => {
      const percentage =
        (video.currentTime / video.duration) * 100 || 0;

      progress.value = percentage;

      timeDisplay.textContent =
        `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
    });

    progress.addEventListener("input", () => {
      if (!video.duration) return;

      video.currentTime =
        (progress.value / 100) * video.duration;
    });

    volume.addEventListener("input", () => {
      video.volume = volume.value;
    });

    speed.addEventListener("change", () => {
      video.playbackRate = Number(speed.value);
    });

    fullscreenBtn.addEventListener("click", async () => {
      if (!document.fullscreenElement) {
        await videoWrapper.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    });

    // Spacebar: play/pause
    document.addEventListener("keydown", (event) => {
      if (
        event.code === "Space" &&
        document.activeElement.tagName !== "INPUT" &&
        document.activeElement.tagName !== "SELECT"
      ) {
        event.preventDefault();
        togglePlay();
      }
    });

    // Double-click video for fullscreen
    video.addEventListener("dblclick", async () => {
      if (!document.fullscreenElement) {
        await videoWrapper.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    });
  </script>

</body>
</html>
